# Local development overlay: publish PostGIS and Redis on loopback only.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
#
# Then point DATABASE_URL/REDIS_URL at 127.0.0.1 (see .env.example). Ports are
# configurable so they do not clash with services already on the workstation.
services:
  postgres:
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-5432}:5432"
    networks: [internal, edge]
  redis:
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    networks: [internal, edge]
