[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadforge"
version = "0.2.0"
description = "LeadForge data engine: source adapters, crawling, extraction, local AI classification."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "lxml>=5.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "dnspython>=2.6",
  "polars>=1.0",
  "redis>=5.0",
  "tenacity>=8.3",
  "orjson>=3.10",
  "tldextract>=5.1",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
# Bounded JavaScript rendering (spec 11). Also run `playwright install chromium`.
browser = ["playwright>=1.45"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "types-redis",
]

[tool.hatch.build.targets.wheel]
packages = ["services/leadforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "E501",
  "S101",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"services/leadforge/probe.py" = ["S"]
"services/leadforge/crawler.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["services/leadforge"]
