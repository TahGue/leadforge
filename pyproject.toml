[project]
name = "leadforge"
version = "0.1.0"
description = "LeadForge data engine: crawling, extraction, verification."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "lxml>=5.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "dnspython>=2.6",
  "polars>=1.0",
  "redis>=5.0",
  "tenacity>=8.3",
  "orjson>=3.10",
  "tldextract>=5.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "types-redis",
]

# Tooling workspace only. Per-service packaging (one distribution vs many)
# is decided in Phase 1 — see docs/open-questions.md and ADR-0005.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "E501",   # handled by formatter
  "S101",   # asserts allowed in tests
  "S311",   # deterministic test randomness
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["services"]
