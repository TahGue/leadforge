name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://leadforge:leadforge@127.0.0.1:5432/leadforge?schema=public
  SESSION_SECRET: ci-session-secret-ci-session-secret-0000
  UNSUBSCRIBE_SIGNING_KEY: ci-unsubscribe-key-ci-unsubscribe-key
  MAIL_POSTAL_ADDRESS: LeadForge CI, Testgatan 1, 111 22 Stockholm
  APP_URL: http://localhost:3000

jobs:
  node:
    name: Node - typecheck, build, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @leadforge/database run generate

      - name: Apply migrations
        run: pnpm --filter @leadforge/database run deploy

      - name: Seed
        run: pnpm --filter @leadforge/database run seed

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Compliance unit tests
        run: pnpm --filter @leadforge/compliance test

      - name: API integration tests
        run: pnpm --filter @leadforge/web test

      - name: Worker integration tests
        run: pnpm --filter @leadforge/worker test

      - name: Build
        run: pnpm --filter @leadforge/web build

  python:
    name: Python - lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy services/leadforge

      - name: Apply schema
        env:
          PGPASSWORD: leadforge
        run: >-
          psql -h 127.0.0.1 -U leadforge -d leadforge -v ON_ERROR_STOP=1
          -f packages/database/prisma/migrations/20260101000000_init/migration.sql

      - name: Pytest
        run: uv run pytest

  compose:
    name: Compose - config validity
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      SESSION_SECRET: ci-session-secret-ci-session-secret-0000
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: docker compose config -q

  docker:
    name: Docker - build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t leadforge-web:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t leadforge-worker:ci .

      - name: Build crawler image
        run: docker build -f services/Dockerfile -t leadforge-crawler:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
