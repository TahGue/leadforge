name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://leadforge:leadforge@127.0.0.1:5432/leadforge?schema=public
  REDIS_URL: redis://127.0.0.1:6379/0
  SESSION_SECRET: ci-session-secret-ci-session-secret-0000
  UNSUBSCRIBE_SIGNING_KEY: ci-unsubscribe-key-ci-unsubscribe-key
  MAIL_POSTAL_ADDRESS: LeadForge CI, Testgatan 1, 111 22 Stockholm
  APP_URL: http://localhost:3000

jobs:
  node:
    name: Node - typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (production)
        run: pnpm audit --prod

      - name: Generate Prisma client
        run: pnpm --filter @leadforge/database run generate

      - name: Apply migrations
        run: pnpm --filter @leadforge/database run deploy

      - name: Schema matches migrations
        run: node scripts/check-schema-drift.mjs

      - name: Reference data and seed
        run: |
          node packages/database/prisma/reference.mjs
          pnpm --filter @leadforge/database run seed

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests (compliance, pipeline)
        run: |
          pnpm --filter @leadforge/compliance test
          pnpm --filter @leadforge/pipeline test

      - name: API integration tests
        run: pnpm --filter @leadforge/web test

      - name: Worker integration tests
        run: pnpm --filter @leadforge/worker test

      - name: Build
        run: pnpm --filter @leadforge/web build

  python:
    name: Python - lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync

      - name: Dependency audit
        run: |
          uv export --no-dev --no-emit-project --no-hashes > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy services/leadforge

      - name: Apply all migrations
        env:
          PGPASSWORD: leadforge
        run: |
          for file in $(ls -d packages/database/prisma/migrations/*/ | sort); do
            psql -h 127.0.0.1 -U leadforge -d leadforge -v ON_ERROR_STOP=1 -q -f "${file}migration.sql"
          done

      - name: Pytest
        run: uv run pytest

  compose:
    name: Compose - config validity
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      SESSION_SECRET: ci-session-secret-ci-session-secret-0000
    steps:
      - uses: actions/checkout@v4
      - name: Validate (all profiles, dev overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile crawler --profile ai --profile monitoring config -q

  docker:
    name: Docker - build and smoke test stack
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      SESSION_SECRET: ci-session-secret-ci-session-secret-0000
      METRICS_TOKEN: ci-metrics-token
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose --profile crawler build

      - name: Start stack
        run: docker compose --profile crawler up -d postgres redis migrate web worker crawler

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              echo " healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=200
          exit 1

      - name: Seed database
        run: docker compose exec -T web node packages/database/prisma/seed.mjs

      - name: API smoke test
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@leadforge.local","password":"ChangeMe123!"}' \
            -c cookies.txt
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/v1/companies > /dev/null
          curl -fsS -b cookies.txt "http://127.0.0.1:3000/api/v1/geography/cities?country=SE&q=gote" | grep -q "teborg"
          curl -fsS -b cookies.txt "http://127.0.0.1:3000/api/v1/industries?tree=1" | grep -q '"LEADFORGE"'
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/v1/discovery-projects > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://127.0.0.1:3000/api/v1/campaigns)" = "404"
          curl -fsS -H "authorization: Bearer ${METRICS_TOKEN}" http://127.0.0.1:3000/api/v1/metrics | grep -q leadforge_companies
          echo "api smoke passed"

      - name: Crawler worker is running
        run: |
          sleep 5
          docker compose ps crawler --format '{{.State}}' | grep -q running
          docker compose logs crawler | grep -q "worker start"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile crawler down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan tracked tree
        run: node scripts/secret-scan.mjs
